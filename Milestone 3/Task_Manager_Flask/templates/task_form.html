<!doctype html>
<html>
<head>
  <title>{% if edit_mode %}Edit{% else %}Add{% endif %} Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container mt-4">
    <h1 class="mb-4">{% if edit_mode %}Edit{% else %}Add{% endif %} Task</h1>
    
    <form method="post">
      <div class="mb-3">
        <label for="title" class="form-label">Title:</label>
        <input type="text" name="title" id="title" 
               class="form-control" 
               value="{% if edit_mode %}{{ task['title'] }}{% endif %}" 
               required>
      </div>
      <button type="submit" class="btn btn-success">
        {% if edit_mode %}Update{% else %}Add{% endif %} Task
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>
</body>
</html>
